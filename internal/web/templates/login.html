{{template "header" .}}
<h2>Log in</h2>
<form method="post" action="/login" class="stack">
{{template "csrf" .}}
<input type="hidden" name="next" value="{{.Next}}">
<label>Username or email<br>
<input type="text" name="login" value="{{index .Form "login"}}" required autofocus></label>
<label>Password<br>
<input type="password" name="password" required></label>
<button type="submit" class="button">Log in</button>
</form>
<p class="small">Forgot your password? <a href="/recover">Use a recovery code</a> or ask an admin for a reset link.</p>
<p class="small">No account? Membership is invite-only. <a href="/register">Register with a code</a>.</p>
{{template "footer" .}}
