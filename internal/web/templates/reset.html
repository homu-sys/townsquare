{{template "header" .}}
<h2>Choose a new password</h2>
<p>This reset link can be used once. If it expires, ask an admin for another one.</p>
<form method="post" action="/reset" class="stack">
{{template "csrf" .}}
<input type="hidden" name="token" value="{{.ResetToken}}">
<label>New password <span class="hint">(at least 8 characters)</span><br>
<input type="password" name="password" required autofocus></label>
<label>Confirm new password<br>
<input type="password" name="confirm" required></label>
<button type="submit" class="button">Set new password</button>
</form>
{{template "footer" .}}
